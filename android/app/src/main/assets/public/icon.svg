<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pulse-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with squircle radius -->
  <rect width="512" height="512" rx="112" fill="url(#pulse-bg)" />

  <!-- Subtle interior border ring -->
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Connected Network Orbit Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 8" stroke-opacity="0.25" />

  <!-- Stylized Heartbeat / Social Pulse Wave -->
  <path d="M 100 256 L 180 256 L 220 160 L 268 352 L 312 216 L 344 280 L 372 256 L 412 256" 
        fill="none" 
        stroke="url(#glow-grad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Node Dots at key pulse points -->
  <circle cx="220" cy="160" r="14" fill="#38bdf8" />
  <circle cx="268" cy="352" r="14" fill="#ffffff" />
  <circle cx="312" cy="216" r="14" fill="#c084fc" />
  <circle cx="100" cy="256" r="10" fill="#ffffff" opacity="0.8" />
  <circle cx="412" cy="256" r="10" fill="#ffffff" opacity="0.8" />
</svg>
